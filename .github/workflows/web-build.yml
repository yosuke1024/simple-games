# Simple Games — Web 版(pixapps.ai/simple-games/play/)のビルド成果物を作る。
#
# この workflow は**配信しない**。成果物(dist-web/)を artifact として置くだけで、
# 公開は従来どおり人間の手順 — pixapps-landing 側の `npm run sync:simple-games` で
# `simple-games/play/` を置き換えてコミットする(docs/WEB_VERSION.md)。
# landing の main への push が即公開になり得るため、そこは自動化しない。
#
# 広告モード(docs/ADS_POLICY.md「Web 版」):
#   test       — ローカルのプレースホルダ広告(既定)。広告ネットワークには
#                一切接続しない。AdSense に公式テスト ID が存在しないための
#                誠実なテスト形。
#   production — 実 ID を注入する。どちらのネットワークが配信するかは
#                `network` 入力が決める(下記)。有効化の前提(サイト審査・
#                プライバシー文言・同意)は人間作業 — ADS_POLICY.md を参照。
#   disabled   — 広告コードは同梱されるが、ID もテストモードもないため何も出ない。
#
# ネットワーク(production のときだけ意味を持つ):
#   admax   — 忍者AdMax が全面を配信(既定)。AdSense の ID は注入しないので、
#             成果物から Google へのリクエストは 1 件も出ない。AdSense の審査が
#             通っていない間はこちら。
#   adsense — AdSense が主。ADSENSE_CLIENT が必須で、ADMAX_* は実行時
#             フォールバック(ローダー失敗 / unfilled のときだけ差し替え)。
#
# Analytics(docs/WEB_VERSION.md「計測」): GA_MEASUREMENT_ID secret が有効な
# G-... ID のときだけ Web ビルドへ注入する。未設定・不正値は既定 OFF。
name: Web build

on:
  workflow_dispatch:
    inputs:
      ads:
        description: '広告(test: プレースホルダ / production: secrets の実 ID / disabled: なし)'
        type: choice
        options: [test, production, disabled]
        default: test
      network:
        description: '配信ネットワーク(production のときのみ。admax: 忍者AdMax 単独 / adsense: AdSense 主 + AdMax フォールバック)'
        type: choice
        options: [admax, adsense]
        default: admax

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Decide ad mode
        env:
          ADS_INPUT: ${{ inputs.ads }}
          NETWORK_INPUT: ${{ inputs.network }}
          CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          SLOT_HOME: ${{ secrets.ADSENSE_SLOT_HOME }}
          SLOT_RESULT: ${{ secrets.ADSENSE_SLOT_RESULT }}
          ADMAX_HOME_WIDE: ${{ secrets.ADMAX_SLOT_HOME_728X90 }}
          ADMAX_HOME_MOBILE: ${{ secrets.ADMAX_SLOT_HOME_320X100 }}
          ADMAX_RESULT: ${{ secrets.ADMAX_SLOT_RESULT_320X100 }}
          ADMAX_ANCHOR_WIDE: ${{ secrets.ADMAX_ANCHOR_728X90 }}
          ADMAX_ANCHOR_MOBILE: ${{ secrets.ADMAX_ANCHOR_320X100 }}
        run: |
          set -euo pipefail
          echo "### Web build" >> "$GITHUB_STEP_SUMMARY"
          case "$ADS_INPUT" in
            test)
              echo "SG_WEB_ADS_MODE=test" >> "$GITHUB_ENV"
              echo "SG_WEB_ADS_NETWORK=none" >> "$GITHUB_ENV"
              echo "- 広告: **テスト**(プレースホルダ。広告ネットワークへの通信なし)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            production)
              admax_count=0
              for v in "$ADMAX_HOME_WIDE" "$ADMAX_HOME_MOBILE" "$ADMAX_RESULT" "$ADMAX_ANCHOR_WIDE" "$ADMAX_ANCHOR_MOBILE"; do
                [ -n "$v" ] && admax_count=$((admax_count + 1))
              done
              if [ "$NETWORK_INPUT" = "adsense" ] && [ -n "$CLIENT" ]; then
                echo "SG_WEB_ADS_MODE=production" >> "$GITHUB_ENV"
                echo "SG_WEB_ADS_NETWORK=adsense" >> "$GITHUB_ENV"
                echo "- 広告: **AdSense** が主(アンカー有効)" >> "$GITHUB_STEP_SUMMARY"
                [ -n "$SLOT_HOME" ]   && echo "  - ホーム枠: あり" >> "$GITHUB_STEP_SUMMARY"   || echo "  - ホーム枠: なし(ADSENSE_SLOT_HOME 未設定)" >> "$GITHUB_STEP_SUMMARY"
                [ -n "$SLOT_RESULT" ] && echo "  - リザルト枠: あり" >> "$GITHUB_STEP_SUMMARY" || echo "  - リザルト枠: なし(ADSENSE_SLOT_RESULT 未設定)" >> "$GITHUB_STEP_SUMMARY"
                echo "  - AdMax フォールバック枠: ${admax_count}/5 設定済み(実行時の AdSense 失敗時のみ使用)" >> "$GITHUB_STEP_SUMMARY"
                echo "::notice::本番有効化の前提(サイト審査・プライバシー文言・同意・Auto ads でアンカーのみ有効化)は人間作業です。docs/ADS_POLICY.md「Web 版」を参照。"
              elif [ "$NETWORK_INPUT" = "admax" ] && [ "$admax_count" -gt 0 ]; then
                echo "SG_WEB_ADS_MODE=production" >> "$GITHUB_ENV"
                echo "SG_WEB_ADS_NETWORK=admax" >> "$GITHUB_ENV"
                echo "- 広告: **忍者AdMax** が全面を配信(枠 ${admax_count}/5 設定済み)" >> "$GITHUB_STEP_SUMMARY"
                echo "  - AdSense の ID は注入しない → 成果物から Google へのリクエストはゼロ" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "SG_WEB_ADS_MODE=disabled" >> "$GITHUB_ENV"
                echo "SG_WEB_ADS_NETWORK=none" >> "$GITHUB_ENV"
                echo "- 広告: **無効**(選んだネットワークの ID が未設定)" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::network=${NETWORK_INPUT} に必要な secret が未設定のため、広告なしでビルドしました。"
              fi
              ;;
            disabled)
              echo "SG_WEB_ADS_MODE=disabled" >> "$GITHUB_ENV"
              echo "SG_WEB_ADS_NETWORK=none" >> "$GITHUB_ENV"
              echo "- 広告: 無効" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Decide analytics mode
        env:
          MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          if [[ "$MEASUREMENT_ID" =~ ^G-[A-Z0-9]{6,}$ ]]; then
            echo "SG_WEB_ANALYTICS_MODE=enabled" >> "$GITHUB_ENV"
            echo "- Analytics: **有効**(GA4 Web Stream)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SG_WEB_ANALYTICS_MODE=disabled" >> "$GITHUB_ENV"
            echo "- Analytics: **無効**(GA_MEASUREMENT_ID 未設定または不正)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GA_MEASUREMENT_ID が未設定または G-... 形式ではないため、計測なしでビルドします。"
          fi

      - name: Build web assets (--mode web → dist-web)
        run: pnpm --filter simple-games build:web
        env:
          VITE_ADSENSE_USE_TEST_ADS: ${{ env.SG_WEB_ADS_MODE == 'test' && 'true' || '' }}
          # AdSense の ID は network=adsense のときだけ注入する。注入しなければ
          # 成果物は AdMax 単独で動き、Google へのリクエストは 1 件も出ない
          # (docs/ADS_POLICY.md「Web 版」の「二つのネットワーク」)。
          VITE_ADSENSE_CLIENT: ${{ env.SG_WEB_ADS_NETWORK == 'adsense' && secrets.ADSENSE_CLIENT || '' }}
          VITE_ADSENSE_SLOT_HOME: ${{ env.SG_WEB_ADS_NETWORK == 'adsense' && secrets.ADSENSE_SLOT_HOME || '' }}
          VITE_ADSENSE_SLOT_RESULT: ${{ env.SG_WEB_ADS_NETWORK == 'adsense' && secrets.ADSENSE_SLOT_RESULT || '' }}
          VITE_ADMAX_SLOT_HOME_728X90: ${{ env.SG_WEB_ADS_MODE == 'production' && secrets.ADMAX_SLOT_HOME_728X90 || '' }}
          VITE_ADMAX_SLOT_HOME_320X100: ${{ env.SG_WEB_ADS_MODE == 'production' && secrets.ADMAX_SLOT_HOME_320X100 || '' }}
          VITE_ADMAX_SLOT_RESULT_320X100: ${{ env.SG_WEB_ADS_MODE == 'production' && secrets.ADMAX_SLOT_RESULT_320X100 || '' }}
          VITE_ADMAX_ANCHOR_728X90: ${{ env.SG_WEB_ADS_MODE == 'production' && secrets.ADMAX_ANCHOR_728X90 || '' }}
          VITE_ADMAX_ANCHOR_320X100: ${{ env.SG_WEB_ADS_MODE == 'production' && secrets.ADMAX_ANCHOR_320X100 || '' }}
          VITE_GA_MEASUREMENT_ID: ${{ env.SG_WEB_ANALYTICS_MODE == 'enabled' && secrets.GA_MEASUREMENT_ID || '' }}

      # モードに関係なく、web バンドルには AdSense 統合が入っているはず
      # (test / disabled はランタイムで出さないだけ)。Analytics は ID が
      # 注入されたときだけ存在し、未設定時は成果物にも残さない。
      - name: Verify web-only integrations and native separation
        env:
          EXPECT_WEB_ANALYTICS: ${{ env.SG_WEB_ANALYTICS_MODE == 'enabled' && '1' || '0' }}
        run: bash .github/scripts/check-dist-ads-separation.sh web

      - uses: actions/upload-artifact@v4
        with:
          name: simple-games-web-${{ env.SG_WEB_ADS_MODE }}-${{ env.SG_WEB_ADS_NETWORK }}
          path: apps/simple-games/dist-web
          if-no-files-found: error
          retention-days: 14
