# Simple Games — Web 版(pixapps.ai/simple-games/play/)のビルド成果物を作る。
#
# この workflow は**配信しない**。成果物(dist-web/)を artifact として置くだけで、
# 公開は従来どおり人間の手順 — pixapps-landing 側の `npm run sync:simple-games` で
# `simple-games/play/` を置き換えてコミットする(docs/WEB_VERSION.md)。
# landing の main への push が即公開になり得るため、そこは自動化しない。
#
# 広告モード(docs/ADS_POLICY.md「Web 版」):
#   test       — ローカルのプレースホルダ広告(既定)。AdSense には一切接続しない。
#                AdSense に公式テスト ID が存在しないための誠実なテスト形。
#   production — AdSense。ADSENSE_CLIENT の secret が必須(これだけで Auto ads の
#                アンカーが動く)。ディスプレイ枠は ADSENSE_SLOT_HOME /
#                ADSENSE_SLOT_RESULT が揃った枠だけ出る(無い枠は出ないだけ)。
#                有効化の前提(サイト審査・プライバシー文言・同意・Auto ads で
#                アンカーのみ有効化)は人間作業 — ADS_POLICY.md「Web 版」を参照。
#   disabled   — 広告コードは同梱されるが、ID もテストモードもないため何も出ない。
name: Web build

on:
  workflow_dispatch:
    inputs:
      ads:
        description: '広告(test: プレースホルダ / production: secrets の AdSense ID / disabled: なし)'
        type: choice
        options: [test, production, disabled]
        default: test

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Decide ad mode
        env:
          ADS_INPUT: ${{ inputs.ads }}
          CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          SLOT_HOME: ${{ secrets.ADSENSE_SLOT_HOME }}
          SLOT_RESULT: ${{ secrets.ADSENSE_SLOT_RESULT }}
        run: |
          set -euo pipefail
          echo "### Web build" >> "$GITHUB_STEP_SUMMARY"
          case "$ADS_INPUT" in
            test)
              echo "SG_WEB_ADS_MODE=test" >> "$GITHUB_ENV"
              echo "- 広告: **テスト**(プレースホルダ。広告ネットワークへの通信なし)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            production)
              if [ -n "$CLIENT" ]; then
                echo "SG_WEB_ADS_MODE=production" >> "$GITHUB_ENV"
                echo "- 広告: 本番 AdSense ID でビルド(アンカー有効)" >> "$GITHUB_STEP_SUMMARY"
                [ -n "$SLOT_HOME" ]   && echo "  - ホーム枠: あり" >> "$GITHUB_STEP_SUMMARY"   || echo "  - ホーム枠: なし(ADSENSE_SLOT_HOME 未設定)" >> "$GITHUB_STEP_SUMMARY"
                [ -n "$SLOT_RESULT" ] && echo "  - リザルト枠: あり" >> "$GITHUB_STEP_SUMMARY" || echo "  - リザルト枠: なし(ADSENSE_SLOT_RESULT 未設定)" >> "$GITHUB_STEP_SUMMARY"
                echo "::notice::本番有効化の前提(サイト審査・プライバシー文言・同意・Auto ads でアンカーのみ有効化)は人間作業です。docs/ADS_POLICY.md「Web 版」を参照。"
              else
                echo "SG_WEB_ADS_MODE=disabled" >> "$GITHUB_ENV"
                echo "- 広告: **無効**(ADSENSE_CLIENT の secret が未設定)" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::ADSENSE_CLIENT が未設定のため、広告なしでビルドしました。"
              fi
              ;;
            disabled)
              echo "SG_WEB_ADS_MODE=disabled" >> "$GITHUB_ENV"
              echo "- 広告: 無効" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Build web assets (--mode web → dist-web)
        run: pnpm --filter simple-games build:web
        env:
          VITE_ADSENSE_USE_TEST_ADS: ${{ env.SG_WEB_ADS_MODE == 'test' && 'true' || '' }}
          VITE_ADSENSE_CLIENT: ${{ env.SG_WEB_ADS_MODE == 'production' && secrets.ADSENSE_CLIENT || '' }}
          VITE_ADSENSE_SLOT_HOME: ${{ env.SG_WEB_ADS_MODE == 'production' && secrets.ADSENSE_SLOT_HOME || '' }}
          VITE_ADSENSE_SLOT_RESULT: ${{ env.SG_WEB_ADS_MODE == 'production' && secrets.ADSENSE_SLOT_RESULT || '' }}

      # モードに関係なく、web バンドルには AdSense 統合が入っているはず
      # (test / disabled はランタイムで出さないだけ)。配線切れの検知。
      - name: Verify the web bundle carries the ad integration
        run: bash .github/scripts/check-dist-ads-separation.sh web

      - uses: actions/upload-artifact@v4
        with:
          name: simple-games-web-${{ env.SG_WEB_ADS_MODE }}
          path: apps/simple-games/dist-web
          if-no-files-found: error
          retention-days: 14
