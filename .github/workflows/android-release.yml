# Simple Games — Android release build. Runs ONLY on a v* tag or a manual
# dispatch; shared-package changes never auto-release the app
# (docs/ARCHITECTURE.md).
#
# The tag is unprefixed because this monorepo has exactly one releasable
# artifact and that is a product decision, not a coincidence: the five games
# ship as one app, so adding a game is a release of this app rather than a new
# one. `apps/` once held a second app and was deliberately consolidated.
#
# The tag is the release: it decides versionName / versionCode, and it is what
# turns on the "this must be signed" guard. Upload to Play Console stays a
# manual human step (docs/RELEASE_CHECKLIST.md §7).
name: Android release

on:
  workflow_dispatch:
    inputs:
      # test = Google 公式テスト広告でビルドする(実機で広告表示を確認する用。
      # secret 不要、収益は発生しない)。タグのリリースビルドでは選べない —
      # タグ push はこの input を持たず、常に production 経路になる。
      ads:
        description: '広告(production: secrets の本番 ID / test: 公式テスト広告)'
        type: choice
        options: [production, test]
        default: production
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v1.2.3 → versionName 1.2.3, versionCode 10203.
      # versionCode must increase forever, so it is derived, not hand-kept:
      # major * 10000 + minor * 100 + patch — which means minor and patch have
      # to stay below 100. Re-uploading a build to Play needs a new versionCode,
      # which means a new tag — that is deliberate.
      # A manual dispatch has no tag and builds an unpublishable 0.0.0 / 1.
      - name: Resolve version from tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            name="${REF_NAME#v}"
            # Components must be canonical (no leading zeros): 1.01.0 and 1.1.0
            # derive the same versionCode, and Play never lets a versionCode be
            # reused, so the second tag would be permanently unpublishable.
            # A loose `v*` tag (v1, v2.0-rc1) lands here and is refused, so the
            # cost of the short pattern is a red run, never a wrong build.
            if [[ ! "$name" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::タグは vMAJOR.MINOR.PATCH の形にしてください(先頭ゼロなし。受け取った値: ${REF_NAME})"
              exit 1
            fi
            major="${name%%.*}"
            rest="${name#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            # 1.0.100 and 1.1.0 would both be 10100 — same permanent collision.
            if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then
              echo "::error::minor / patch は 100 未満にしてください(${REF_NAME} は versionCode が別の版と衝突します)"
              exit 1
            fi
            code=$(( major * 10000 + minor * 100 + patch ))
            # Play requires versionCode >= 1, so v0.0.0 is not a release.
            if [ "$code" -lt 1 ]; then
              echo "::error::${REF_NAME} は versionCode 0 になり、Play にアップロードできません。"
              exit 1
            fi
          else
            name="0.0.0"
            code=1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "### Android release" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionName: \`$name\` / versionCode: \`$code\`" >> "$GITHUB_STEP_SUMMARY"

      # A tag means "I intend to publish this". An unsigned artifact cannot be
      # published, so fail here rather than handing over a file that looks
      # finished and is not (docs/PRODUCT_PRINCIPLES.md: 未検証を検証済みにしない).
      - name: Guard — a tagged release must be signable
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$KEYSTORE_BASE64" ]  || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::署名 secret がありません:${missing} — 未署名のビルドは Play にアップロードできません。"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      # Ad mode is three-way (docs/ADS_POLICY.md):
      #   production — unit IDs from repository secrets. The two IDs are a pair
      #                and are injected together or not at all: only the banner
      #                ID would bake a production unit into a build whose
      #                manifest still carries Google's test app ID.
      #   test       — dispatch-only (`ads: test`): Google's official test ads,
      #                for checking ad behaviour on a device. No secrets used,
      #                no revenue. A tag never gets here: tag pushes carry no
      #                inputs, and the guard below refuses the combination
      #                outright so a release build can never ship test ads.
      #   disabled   — secrets not configured: the build ships with ads
      #                disabled (never test IDs, never hardcoded production
      #                IDs). The collection has one AdMob app and exactly one
      #                ad format, so there is one banner secret and no
      #                interstitial/rewarded ID to inject — those formats do
      #                not exist.
      # Secret names carry the platform (ADMOB_ANDROID_*) because AdMob app
      # and unit IDs are per-OS: a future iOS lane adds ADMOB_IOS_* beside
      # them instead of overloading these.
      - name: Decide ad mode
        env:
          ADS_INPUT: ${{ inputs.ads || 'production' }}
          REF_TYPE: ${{ github.ref_type }}
          BANNER_ID: ${{ secrets.ADMOB_ANDROID_BANNER_ID }}
          APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          if [ "$ADS_INPUT" = "test" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              echo "::error::タグのリリースビルドをテスト広告で作ることはできません。"
              exit 1
            fi
            echo "SG_ADS_MODE=test" >> "$GITHUB_ENV"
            echo "- 広告: **テスト広告**(Google 公式テスト ID — 公開不可のビルド)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$BANNER_ID" ] && [ -n "$APP_ID" ]; then
            echo "SG_ADS_MODE=production" >> "$GITHUB_ENV"
            echo "- 広告: 本番 AdMob ID でビルド" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SG_ADS_MODE=disabled" >> "$GITHUB_ENV"
            echo "- 広告: **無効**(ADMOB_ANDROID_APP_ID / ADMOB_ANDROID_BANNER_ID の secret が未設定)" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$BANNER_ID$APP_ID" ]; then
              echo "::warning::AdMob の secret が片方だけ設定されています。両方揃うまで広告なしでビルドします。"
            else
              echo "::warning::AdMob の secret が未設定のため、広告なしのビルドになりました。"
            fi
          fi

      - name: Build web assets
        run: pnpm --filter simple-games build
        env:
          VITE_ADMOB_ANDROID_BANNER_ID: ${{ env.SG_ADS_MODE == 'production' && secrets.ADMOB_ANDROID_BANNER_ID || '' }}
          VITE_ADMOB_USE_TEST_ADS: ${{ env.SG_ADS_MODE == 'test' && 'true' || '' }}

      # `pnpm --filter <pkg> exec cap` does not resolve the workspace binary on
      # pnpm 10 ("Command \"cap\" not found"), so run it from the app directory.
      - name: Capacitor sync
        working-directory: apps/simple-games
        run: pnpm exec cap sync android

      # The keystore only ever exists as a file inside this run's temp dir.
      # All four secrets or none: handing Gradle a keystore without its password
      # and alias makes signReleaseBundle die on a bare NullPointerException,
      # instead of the unsigned manual build this is documented to produce.
      # A tag with a partial set never reaches here — the guard above stops it.
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] \
             || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ -n "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
              echo "::warning::署名 secret が一部だけ設定されています。4 つ揃うまで未署名でビルドします。"
            fi
            echo "- 署名: **なし**(署名 secret が未設定の手動ビルド)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SG_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "- 署名: upload key で署名" >> "$GITHUB_STEP_SUMMARY"

      # AAB is what Play takes. The APK exists for the release-checklist item
      # that cannot be done any other way: installing on a low-spec device or
      # emulator (§4). Billing does not work from a sideloaded APK — that check
      # needs the internal test track, and that is expected, not a bug.
      - name: Gradle build (AAB + APK)
        working-directory: apps/simple-games/android
        run: ./gradlew bundleRelease assembleRelease
        env:
          # test / disabled leave this empty → build.gradle falls back to
          # Google's test application ID (docs/ADS_POLICY.md 広告 ID の管理).
          ADMOB_ANDROID_APP_ID: ${{ env.SG_ADS_MODE == 'production' && secrets.ADMOB_ANDROID_APP_ID || '' }}
          SG_VERSION_NAME: ${{ steps.version.outputs.name }}
          SG_VERSION_CODE: ${{ steps.version.outputs.code }}
          SG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Gradle silently produces an unsigned bundle when the signing config is
      # absent, so confirm the signature block is actually in the AAB instead of
      # trusting that the previous step "looked fine".
      - name: Verify the AAB is signed
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          aab=apps/simple-games/android/app/build/outputs/bundle/release/app-release.aab
          # Listed to a file on purpose: `unzip -l | grep -q` makes grep close
          # the pipe on its first match, unzip dies of SIGPIPE with 141, and
          # under `pipefail` a correctly signed AAB reads as a failure — the
          # more centrally the signature sits in the listing, the more reliably
          # it misfires.
          unzip -l "$aab" > "$RUNNER_TEMP/aab-listing.txt"
          if ! grep -qE 'META-INF/.*\.(RSA|DSA|EC)$' "$RUNNER_TEMP/aab-listing.txt"; then
            echo "::error::$aab に署名ブロックがありません。"
            exit 1
          fi
          echo "署名を確認しました: $aab"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: simple-games-${{ steps.version.outputs.name }}
          path: |
            apps/simple-games/android/app/build/outputs/bundle/release/*.aab
            apps/simple-games/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
