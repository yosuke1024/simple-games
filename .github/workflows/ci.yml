# Root CI, three jobs plus the brand-principle guard:
#   checks — install → lint → typecheck → build (every workspace), then the
#            web build, the ad-separation grep, the iOS version pair, the size
#            gate and the measurement-ID guard.
#   test   — vitest, split into parallel shards. A pull request runs only the
#            tests related to its diff plus the always-on gates
#            (apps/simple-games/scripts/test-scoped.mjs — the same scoping as
#            `pnpm verify:changed`); a push to main runs the whole suite. The
#            suite grows with the number of games (732 files, 8½ minutes in one
#            job on 2026-10-22), and most PRs touch one game.
#   verify — the check the main-branch ruleset requires next to "Brand
#            principles": green only when every other job is.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      # The web-mode build (dist-web/, docs/WEB_VERSION.md) must keep building,
      # and the two artifacts must stay separated: no AdSense code in the
      # native bundle, the AdSense integration present in the web bundle
      # (docs/ADS_POLICY.md「Web 版」). Needs both builds, hence here and not
      # in the grep-only principles job.
      - run: pnpm --filter simple-games build:web
      - run: bash .github/scripts/check-dist-ads-separation.sh

      # The iOS version is the one version number this repository still keeps by
      # hand: the Android lane derives it from the tag, but the iOS archive is
      # made on a Mac and ships whatever the Xcode project says
      # (apps/simple-games/scripts/ios-version.mjs). Hand-kept numbers rot —
      # this one sat at 1.0 / 1 through four tags — so the pair is checked for
      # internal consistency on every PR, and against the tag itself in
      # android-release.yml.
      - run: pnpm --filter simple-games ios:version check

      # Size gate (issue #26): raw/gzip per chunk against size-baseline.json,
      # per-game budgets once the lazy split exists, and the initial-graph
      # check. Needs both dist/ and dist-web/, so it lives here too.
      - run: pnpm --filter simple-games size:check

      # 上の検査は「ID が環境に無いとき native 成果物に ID が無い」ことしか
      # 見ていない。守っているのは実際にはソースの並び順 —— mode ゲートを
      # `import.meta.env.VITE_GA_MEASUREMENT_ID` の読み出しより**先**に置く
      # ことだけで、順番が逆だと Vite が埋め込んだ文字列がツリーシェイクを
      # 生き延びる(`"G-…"?.trim()` は副作用ありとみなされる)。CI が ID を
      # 持たない限り、その穴は緑のまま通る。だからここでダミーを注入して
      # 一度ビルドし、成果物に残らないことを確かめる(issue #84)。
      # turbo は Vite の VITE_* をキャッシュキーに含めるので、これは
      # 直前のビルドのキャッシュではなく実際の再ビルドになる。
      - name: Native build must not carry a measurement ID even when one is in the env
        run: pnpm build && bash .github/scripts/check-dist-ads-separation.sh native
        env:
          VITE_GA_MEASUREMENT_ID: G-CIGUARD01

  test:
    name: test ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # One red shard must not cancel the others: the full picture of what
      # failed is worth the minutes, and a cancelled shard reads as "unknown".
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull-request scoping diffs against the base branch
          # (git diff origin/<base>...HEAD), so the merge-base has to be in the
          # clone. The pack is ~30 MB; a full history costs seconds.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # On a pull request: the tests related to the diff plus the always-on
      # gates (src/test src/app src/i18n src/club read sources with node:fs
      # and are invisible to the import graph). On a push to main: everything.
      # Each shard takes its slice of that set; the script prints the set.
      - name: vitest
        working-directory: apps/simple-games
        run: >
          node scripts/test-scoped.mjs
          ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  verify:
    # The main-branch ruleset requires this check by name (and "Brand
    # principles"), so it stays `verify` and must be red whenever any other job
    # is. A job with `needs` is skipped when a dependency fails, and a skipped
    # check does not block a merge the way a failed one does — hence
    # `if: always()` plus an explicit verdict on every result. `principles`
    # is required on its own too; it is in the list so that `verify` means
    # "everything is green" even if the ruleset changes.
    needs: [checks, test, principles]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every other job must have succeeded
        run: |
          echo "checks=${{ needs.checks.result }} test=${{ needs.test.result }} principles=${{ needs.principles.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.principles.result }}" = success

  # Runs without installing anything: it only greps the source. Kept separate so a
  # broken promise is reported as a broken promise, not as "the build failed".
  principles:
    name: Brand principles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-principles.sh
