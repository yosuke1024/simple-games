# Root CI: install → lint → typecheck → test → build for every workspace,
# plus the brand-principle guard.
# With a single app this runs everything; when more games are added, narrow
# the scope with `turbo --filter` based on changed paths (see docs/ARCHITECTURE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The web-mode build (dist-web/, docs/WEB_VERSION.md) must keep building,
      # and the two artifacts must stay separated: no AdSense code in the
      # native bundle, the AdSense integration present in the web bundle
      # (docs/ADS_POLICY.md「Web 版」). Needs both builds, hence here and not
      # in the grep-only principles job.
      - run: pnpm --filter simple-games build:web
      - run: bash .github/scripts/check-dist-ads-separation.sh

      # Size gate (issue #26): raw/gzip per chunk against size-baseline.json,
      # per-game budgets once the lazy split exists, and the initial-graph
      # check. Needs both dist/ and dist-web/, so it lives here too.
      - run: pnpm --filter simple-games size:check

  # Runs without installing anything: it only greps the source. Kept separate so a
  # broken promise is reported as a broken promise, not as "the build failed".
  principles:
    name: Brand principles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-principles.sh
