# Root CI: install → lint → typecheck → test → build for every workspace.
# With a single app this runs everything; when more games are added, narrow
# the scope with `turbo --filter` based on changed paths (see docs/ARCHITECTURE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
