apply plugin: 'com.android.application'

// Release identity comes from the git tag, not from this file. The release
// workflow parses `simple-games-v<major>.<minor>.<patch>` and injects
// SG_VERSION_NAME / SG_VERSION_CODE; a plain local build falls back to the
// values below, which exist only so `./gradlew assembleDebug` works — they are
// NOT what gets published (docs/RELEASE_CHECKLIST.md §7).
def sgVersionName = System.getenv("SG_VERSION_NAME") ?: "0.0.0"
def sgVersionCode = (System.getenv("SG_VERSION_CODE") ?: "1") as Integer

// Signing material never lives in the repo (.gitignore blocks *.jks/*.keystore).
// The workflow decodes the upload key from a secret into a temp file and points
// SG_KEYSTORE_PATH at it. With no key present the release build stays unsigned,
// which is fine locally and is refused for tag builds by the workflow itself.
def sgKeystorePath = System.getenv("SG_KEYSTORE_PATH")
def sgHasKeystore = sgKeystorePath != null && !sgKeystorePath.isEmpty() && file(sgKeystorePath).exists()

// Meta install measurement (issue #204, docs/META_ANDROID_ACQUISITION.md).
// Off unless a build asks for it by name, and then only in the release
// variant: without SG_META_ANDROID_ENABLED=true the Meta SDK is not a
// dependency of this app at all — not a disabled feature, an absent one — and
// a debug build never carries it whatever the environment says, so nothing a
// developer runs reports to the production Meta app.
//
// The App ID and Client Token are client-side configuration (they end up in
// the APK and are not secrets the way an App Secret is), but they are still
// injected rather than committed, the same way the AdMob IDs are. A build
// that asked for Meta and did not get a well-formed pair stops here instead
// of shipping a switch that silently does nothing.
def sgMetaEnabled = System.getenv("SG_META_ANDROID_ENABLED") == "true"
def sgMetaAppId = (System.getenv("META_ANDROID_APP_ID") ?: "").trim()
def sgMetaClientToken = (System.getenv("META_ANDROID_CLIENT_TOKEN") ?: "").trim()
// The one version this build has been audited against (the data inventory in
// docs/META_ANDROID_ACQUISITION.md is for exactly this release). Changing it
// means re-reading the SDK, not just bumping the number.
def sgMetaSdkVersion = "18.3.0"
if (sgMetaEnabled) {
    if (!(sgMetaAppId ==~ /[0-9]{8,20}/)) {
        throw new GradleException("SG_META_ANDROID_ENABLED=true needs META_ANDROID_APP_ID (digits only).")
    }
    if (!(sgMetaClientToken ==~ /[0-9a-f]{32}/)) {
        throw new GradleException("SG_META_ANDROID_ENABLED=true needs META_ANDROID_CLIENT_TOKEN (32 lowercase hex characters).")
    }
}

android {
    namespace = "com.pixapps.simplegames"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pixapps.simplegames"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode sgVersionCode
        versionName sgVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // AdMob application ID for the manifest meta-data. The release
        // workflow injects the production ID via the ADMOB_ANDROID_APP_ID env
        // var (platform-named because AdMob app IDs are per-OS and an iOS
        // build will carry its own); local/dev builds fall back to Google's
        // official TEST app ID. Never commit the production ID
        // (docs/ADS_POLICY.md).
        manifestPlaceholders = [
            admobAppId: System.getenv("ADMOB_ANDROID_APP_ID") ?: "ca-app-pub-3940256099942544~3347511713"
        ]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (sgHasKeystore) {
            create("release") {
                storeFile file(sgKeystorePath)
                storePassword System.getenv("SG_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SG_KEY_ALIAS")
                keyPassword System.getenv("SG_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (sgHasKeystore) {
                signingConfig signingConfigs.getByName("release")
            }
            // Code/resource shrinking is release-only; debug builds stay
            // unshrunk so local development keeps fast, debuggable builds.
            // Keep rules (and the audit that justifies them) live in
            // proguard-rules.pro next to this file.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (sgMetaEnabled) {
                resValue "string", "sg_meta_app_id", sgMetaAppId
                resValue "string", "sg_meta_client_token", sgMetaClientToken
            }
        }
    }
    // Exactly one MetaInstallPlugin is compiled into each variant: the real one
    // (src/metaOn) in a release that asked for Meta, the empty stub
    // (src/metaOff) everywhere else. The manifest overlay that
    // switches the SDK's automatic behaviour off travels with the real one.
    sourceSets {
        debug {
            java.srcDirs += 'src/metaOff/java'
        }
        release {
            java.srcDirs += sgMetaEnabled ? 'src/metaOn/java' : 'src/metaOff/java'
            if (sgMetaEnabled) {
                manifest.srcFile 'src/metaOn/AndroidManifest.xml'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // ShortcutManagerCompat / IconCompat for the home-screen shortcut plugin
    // (HomeShortcutPlugin.java, issue #110). Same version capacitor-android
    // builds against (variables.gradle), declared here because the app's own
    // source compiles against it directly.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation project(':capacitor-android')
    // Meta install measurement (issue #204): facebook-core only — App Events,
    // nothing else of the SDK (no Login, Share, Messenger, Audience Network).
    // The Install Referrer client is already one of its dependencies; it is
    // named here because src/metaOn reads the referrer itself before the
    // install is reported (see MetaInstallPlugin.java).
    if (sgMetaEnabled) {
        releaseImplementation "com.facebook.android:facebook-core:$sgMetaSdkVersion"
        releaseImplementation "com.android.installreferrer:installreferrer:2.2"
    }
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
