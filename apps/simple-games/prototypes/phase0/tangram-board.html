    <title>Phase 0 — Tangram board</title>
    <!--
================================================================================
 Phase 0 の使い捨て試作 — Tangram の入力マッパー + 最小の盤
 (THROWAWAY PROTOTYPE. Not part of the app: not in the registry, not bundled,
  not translated, no persistence beyond the page lifetime, no network, no
  external resources.)

 計画: docs/plans/2026-10-20-overtake-make-the-target-nested-tic-tac-toe-scopa-tangram.md
       §56 Tangram「操作」「助け」「幾何」「UX」「Phase 0 と差し替え」、未決事項。

 何を測るか(通過条件):
   7 枚を 45° 刻みで回し・裏返し・吸着させて、Easy の影絵 3 つ(E1 正方形 /
   E2 大きな三角 / E3 平行四辺形)を 360 幅で「誤操作なく」埋められるか。
   誤操作 = 意図しない回転 / 意図しない置き直し / 吸着先の取り違え。
   → 起きた直後に下の 3 つの集計ボタン(誤回転 / 誤置き直し / 吸着取り違え)のどれかを
     押す(手で数える)。
   自動で数えるもの: ドラッグ数・タップ数・回転できなかった数・置けずにトレイへ
   戻った数・cancel 数・click が来なかったタップ(lostTaps)・Undo 数・「回転の直後の Undo」「置いた直後の Undo」
   (誤操作の疑い。参考値)。完成ごとにログへ DONE の 1 行(端末情報つき)。

 決めたこと(この試作の解釈。計画の推奨に従う):
   - 吸着した位置にだけ置ける。吸着先が無い/重なる/はみ出す位置で離すと何も起きず、
     駒はトレイへ戻る(盤の駒をそうした場合も、盤から抜けてトレイへ。Undo で戻せる)。
     音は無い(この試作には音が一切無い)。
   - 吸着: 運んでいる駒の頂点を、影絵の頂点・置いた駒の頂点に合わせる(頂点吸着)。
     それで置ける候補が無いときだけ、頂点を辺の上へ / 辺を頂点へ寄せる(辺吸着)。
     許容は画面上 SNAP_PX(既定 14px)。許容内で「置ける」候補のうち最も近いものを採る。
     吸着先は計画どおり「影絵と置いた駒」だけ(Easy の薄い境界線は見せるだけで、吸着先では
     ない — 吸着は規則の絵であって最善手の提案ではない、計画「助け」)。
     ?guide=1 は比較用の「別の規則」: Easy の境界線(解の区切り)の頂点・辺にも吸着する。
     解の枠へ引き込まれるので、吸着先の取り違えがほぼ起きなくなる。通過条件はこれで
     測らない(START / DONE の行と情報行に rule=… として必ず出る)。
   - 離したときに起きるのは、最後に画面に描いた姿(塗り = その位置に置く / 輪郭 = トレイへ)。
     指を動かして同じフレームのうちに離しても、描いていない位置では判定しない
     (Block Puzzle §3「画面に出ているものが、離したときに起きること」)。
   - タップ = 45° 時計回り(トレイでも盤でも)。タップは click で受け、ドラッグの後に
     残る click は「使った」印で食べる(ARCHITECTURE.md「指を取り上げられたときの契約」)。
     盤の上では「支点」を中心に回す: 支点 = 駒の頂点のうち吸着先(影絵・置いた駒の頂点)と
     重なっているもの(置いたときに吸着した点を優先し、続けて回す間は同じ支点のまま)。
     支点は動かず、駒が横へずれることは無い(px の許容に頼らないので縮尺によらない。
     8 回続けて回せれば元の姿に戻る)。回した姿がそのままでは置けないなら何も起きない
     (「回転できなかった」としてログに数える。誤操作には数えない)。裏返しも同じ支点で。
   - 裏返しは「裏返し」ボタンだけ(ダブルタップは使わない)。選んだ駒が平行四辺形の
     ときだけ有効。押す(pointerdown)・タップで駒を選ぶ。
   - 1 本の指: 押さえた pointerId を覚え、2 本目の指は何もしない(2 本指の回転は無い)。
     ドラッグ中は 3 つのボタンも答えない。
   - pointercancel: 運んでいる駒はトレイへ戻る(盤から持ち上げた駒も、元の位置には
     戻さずトレイへ — 計画の「運んでいる駒はトレイへ戻る」をそのまま採った。Undo で戻せる)。
   - トレイから運ぶ駒は、重心が指の TRAY_LIFT_PX 上に来る(指で隠れないように)。
     盤の駒を運び直すときは、押さえた点と駒の相対位置を保つ。
   - 経過秒は、その図形で最初に駒に触れた時から。図形ボタン(E1/E2/E3)をもう一度
     押すとやり直し(未完成ならログに ABANDON の 1 行)。完成の後に Undo などで未完成に
     戻ると「完成」の表示を消し(ログに UNDO after DONE)、時計はそのまま進む。もう一度
     完成させると DONE の行がもう 1 行出る(最初の DONE の行は残る)。
   - 座標は浮動小数 + 小さな EPS(本番は Z[√2] の厳密表現 — 計画「幾何」。この試作は
     使い捨てなので浮動小数で済ませている)。

 座標の単位: 大きな正方形 = [0,4]×[0,4](「u」)。小三角の脚 = √2 u。
   計画の「1 単位」(小三角の脚の半分)= √2/2 u ≈ 0.707 u(キーボードの矢印 1 回)。
   情報行に px/u と「小三角の脚の px」を出す(360 幅でどこまで大きな影絵が入るかを見る)。

 画面: 360×640 の縦持ちを前提に、スクロールなしで盤・トレイ・3 ボタンが見える。
   本番の Web 版は広告に 116px を予約するが、この試作は既定で全高を使う(?ads=1 で
   116px の仮の広告枠を 3 ボタンの下に置き、盤をその分だけ縮める)。ログ欄は下に
   はみ出してよい(スクロールして見る)。

 つまみ(URL のクエリで変えられる。例: tangram-board.html?snap=18&lift=0):
   snap   SNAP_PX         吸着の許容(画面 px)            既定 14
   slop   TAP_SLOP_PX     これ以上動いたらドラッグ(px)    既定 6
   lift   TRAY_LIFT_PX    トレイから運ぶ駒の持ち上げ(px)  既定 24
   margin BOARD_MARGIN_PX 盤の内側の余白(px)              既定 16
   scale  BOARD_SCALE     影絵の倍率(<1 で小さい影絵を試す) 既定 1
   tray   TRAY_PPU        トレイの px/u                    既定 17
   guide  GUIDE_SNAP      Easy の境界線にも吸着 (1/0)      既定 0(1 は比較用の別規則)
   edge   EDGE_SNAP       辺吸着を使う (1/0)               既定 1
   ads    RESERVE_ADS     116px の仮の広告枠 (1/0)         既定 0
   (キーボードの吸着の許容は矢印 1 回分 = KBD_SNAP_STEPS × 0.707u、既定 1)
   ログの START / DONE / ABANDON の行と情報行には、いつも
   rule=snap14/edge1/guide0/slop6 の形で、その計測の規則が入る。

 キーボード: Tab で駒を巡る / Enter・Space で持ち上げる・置く(いまの位置から最も近い
   置ける吸着先へ)/ 矢印で 1 単位(0.707u)/ R 回転 / F 裏返し / Escape でトレイへ /
   Ctrl(⌘)+Z で Undo。

 テスト専用(window.__p0 — check-tangram.mjs が使う。実機の試しでは触らない):
   state()        → {silhouette, medium, placed:[{id,x,y,rot,flip,fixed}], tray:[ids],
                     trayPose:{id:{rot,flip}}, selected, counters:{...}, complete, carrying,
                     undoDepth, done, bannerVisible, rule}
   pieces()       → {id: 局所座標の多角形(重心が原点)}
   solution(id)   → その図形の 7 枚の姿 [{id,x,y,rot,flip}]
   place(id,x,y,rot,flip) → boolean(離したときと同じ判定。吸着はしない)
   rotate(id) / flip(id) / returnToTray(id) / undo() → boolean
   pivot(id)      → 盤の駒の支点 [x,y](u)。トレイの駒は null
   isComplete()   → boolean
   boardRect()    → {left,top,width,height,ppu,ox,oy,lift,snapPx,step,trayPpu}
                     (画面 px = ox + x*ppu, oy + y*ppu)
   selfCheck()    → 3 図形の解の幾何検査の結果
   log()          → ログの全文
================================================================================
-->
    <style>
      :root {
        --bg: #f4f4f1;
        --panel: #ffffff;
        --ink: #1d2a2e;
        --muted: #6b7478;
        --sil: #d6d8d6;
        --guide: #a9b0ad;
        --accent0: #2f7f89;
        --accent1: #86c3c9;
        --fixed: #b7c6c8;

        --btn-ink: #1d2a2e;
      }
      html,
      body {
        margin: 0;

      body {

        overflow-x: hidden;
      }
      #app {
        box-sizing: border-box;

  <body>
    <div id="app">
      <div id="info"></div>
      <div id="boardWrap">
        <svg id="board" role="img" aria-label="影絵"></svg>
        <div id="banner" hidden></div>
      </div>
      <div id="tray" role="group" aria-label="トレイ"></div>
      <div class="row" id="actions">
        <button type="button" id="btnRotate">回転</button>
        <button type="button" id="btnFlip">裏返し</button>
        <button type="button" id="btnUndo">Undo</button>
      </div>
      <div id="ads" hidden>広告枠 116px(仮)</div>
      <div class="row" id="tallies">
        <button type="button" id="tallyRot" data-tally="misRotation" title="意図しない回転">
          誤回転 0
        </button>
        <button type="button" id="tallyRep" data-tally="misReplace" title="意図しない置き直し">
          誤置き直し 0
        </button>
        <button type="button" id="tallySnap" data-tally="wrongSnap" title="吸着先の取り違え">
          吸着取り違え 0
        </button>
      </div>
      <div class="row" id="controls">
        <button type="button" data-sil="E1">E1</button>
        <button type="button" data-sil="E2">E2</button>
        <button type="button" data-sil="E3">E3</button>
        <button type="button" id="btnMedium">Medium</button>
        <button type="button" id="btnCopy">コピー</button>
      </div>
    </div>
    <div id="logWrap"><textarea id="log" readonly aria-label="ログ"></textarea></div>
    <svg id="overlay" aria-hidden="true">
      <polygon class="carry" points="" style="display: none"></polygon>
    </svg>

    <script>
      (function () {
        'use strict';

        // ===================================================================
        // Knobs (constants in one place). See the top comment for the meaning.
        // ===================================================================
        var Q = new URLSearchParams(location.search);
        function qn(name, def) {
          var v = Q.get(name);
          if (v === null || v === '') return def;
          var n = Number(v);
          return isFinite(n) ? n : def;
        }
        var K = {
          SNAP_PX: qn('snap', 14),
          TAP_SLOP_PX: qn('slop', 6),
          TRAY_LIFT_PX: qn('lift', 24),
          BOARD_MARGIN_PX: qn('margin', 16),
          BOARD_SCALE: qn('scale', 1),
          BOARD_MAX_PX: 480,
          GUTTER_PX: 16, // left/right gutter: board = viewport width - 2 * 16 (328 at 360)
          TRAY_PPU: qn('tray', 17),
          // 0 = the plan's rule (snap to the silhouette and placed pieces only). 1 is a separate,
          // easier rule kept only for comparison; every START / DONE line says which was used.
          GUIDE_SNAP: qn('guide', 0) === 1,
          EDGE_SNAP: qn('edge', 1) === 1,
          KBD_SNAP_STEPS: 1,
          RESERVE_ADS: qn('ads', 0) === 1,
          ADS_PX: 116,
          // Heights of the rows that must stay visible with the board (info + tray + actions),
          // used only to shrink the board when ?ads=1.
          FIXED_ROWS_PX: 4 + 28 + 4 + 6 + 132 + 6 + 44 + 6,
          EPS: 1e-6,
        };
        var STEP = Math.SQRT2 / 2; // keyboard arrow step in u (= half the small-triangle leg)
        // The snap rule this run is measured under; printed in START / DONE / ABANDON and the info line.
        var RULE =
          'snap' +
          K.SNAP_PX +
          '/edge' +
          (K.EDGE_SNAP ? 1 : 0) +
          '/guide' +
          (K.GUIDE_SNAP ? 1 : 0) +
          '/slop' +
          K.TAP_SLOP_PX;
        var TXT = {
          copy: 'コピー',
          copied: 'コピー済み',
          copyManual: '手でコピー',
          tally: {
            misRotation: ['誤回転', '意図しない回転'],
            misReplace: ['誤置き直し', '意図しない置き直し'],
            wrongSnap: ['吸着取り違え', '吸着先の取り違え'],
          },
        };

        // ===================================================================
        // Pieces. Integer frame: the big square is [0,4]x[0,4] ("u"), y down.
        // Local shapes = reference solution polygons minus their vertex average.
        // ===================================================================
        var REF = {
          L1: [
            [0, 0],
            [4, 0],
            [2, 2],
          ],
          L2: [
            [0, 0],
            [2, 2],
            [0, 4],
          ],
          M: [
            [4, 4],
            [4, 2],
            [2, 4],
          ],
          SQ: [
            [2, 2],
            [3, 1],
            [4, 2],
            [3, 3],
          ],
          S1: [
            [3, 1],
            [4, 0],
            [4, 2],
          ],
          S2: [
            [1, 3],
            [2, 2],
            [3, 3],
          ],
          P: [
            [0, 4],
            [1, 3],
            [3, 3],
            [2, 4],
          ],
        };
        var IDS = ['L1', 'L2', 'M', 'P', 'SQ', 'S1', 'S2']; // tray order (4 + 3)
        var KIND = {
          L1: '大三角 1',
          L2: '大三角 2',
          M: '中三角',
          P: '平行四辺形',
          SQ: '正方形',
          S1: '小三角 1',
          S2: '小三角 2',
        };
        var SHADE = { L1: 0, L2: 1, M: 0, P: 1, SQ: 1, S1: 0, S2: 0 };
        var R2 = Math.SQRT1_2;
        // rot k = k * 45 deg clockwise on screen (y down).
        var ROT = [
          [1, 0],
          [R2, R2],
          [0, 1],
          [-R2, R2],
          [-1, 0],
          [-R2, -R2],
          [0, -1],
          [R2, -R2],
        ];

        function centroidOf(poly) {
          var x = 0,
            y = 0;
          for (var i = 0; i < poly.length; i++) {
            x += poly[i][0];
            y += poly[i][1];
          }
          return [x / poly.length, y / poly.length];
        }
        var LOCAL = {};
        IDS.forEach(function (id) {
          var c = centroidOf(REF[id]);
          LOCAL[id] = REF[id].map(function (p) {
            return [p[0] - c[0], p[1] - c[1]];
          });
        });
        function canFlip(id) {
          return id === 'P';
        }

        // World polygon of a piece at pose {x, y, rot, flip}: mirror (x -> -x) first, then rotate.
        function xf(id, pose) {
          var cs = ROT[((pose.rot % 8) + 8) % 8],
            c = cs[0],
            s = cs[1];

        function flipPiece(id, via) {

          if (!p || p.fixed || !canFlip(id)) return false;
          startClock();
          st.selected = id;
          var next = { x: p.x, y: p.y, rot: p.rot, flip: p.flip ? 0 : 1 };
          if (!p.placed) {
            pushUndo('flip');
            p.flip = next.flip;
            st.counters.flips++;
            log(via + ' flip ' + id + ' (tray) -> flip=' + p.flip);
            afterChange();
            return true;
          }
          var piv = pivotOf(id),
            r = poseAbout(id, p, piv, p.rot, next.flip);
          if (!validPose(id, r.pose)) {
            st.counters.blockedFlips++;
            log(via + ' flip ' + id + ' (board) about ' + fmtPt(piv) + ' BLOCKED');
            render();
            return false;
          }
          pushUndo('flip');
          setPlaced(id, r.pose, piv);
          st.counters.flips++;
          log(
            via +
              ' flip ' +
              id +
              ' (board) about ' +
              fmtPt(piv) +
              ' -> ' +
              fmtPose(r.pose) +
              ' shift=' +
              r.shiftPx.toFixed(1) +
              'px',
          );
          afterChange();
          return true;
        }
        function returnPiece(id, via) {
          var p = st.P[id];
          if (!p || p.fixed || !p.placed) return false;
          pushUndo('return');
          toTray(id);
          log(via + ' return ' + id + ' -> tray');
          afterChange();
          return true;
        }
        function doUndo(via) {
          if (!st.undo.length) {
            log(via + ' undo (empty)');
            return false;
          }
          var u = st.undo.pop();
          st.P = u.P;
          st.counters.undos++;
          if (u.op === 'rotate' || u.op === 'flip') st.counters.undoAfterRotate++;
          if (u.op === 'place' || u.op === 'replace') st.counters.undoAfterPlace++;
          log(via + ' undo (' + u.op + ')');
          afterChange('undo');
          return true;
        }
        function isComplete() {
          return isCompleteWith(SIL[st.sil], st.P);
        }
        function afterChange(why) {
          var complete = isComplete();
          if (st.done && !complete) {
            // Completed earlier, incomplete now (Undo, or a piece dragged off): drop the banner; the
            // clock keeps running and a later completion logs another DONE line (the first stays).
            st.done = false;
            document.getElementById('banner').hidden = true;
            log(
              why === 'undo'
                ? 'UNDO after DONE (banner hidden, clock keeps running)'
                : 'INCOMPLETE after DONE (banner hidden)',
            );
          }
          if (!st.done && complete) {
            st.done = true;
            log(summaryLine('DONE'));
            var b = document.getElementById('banner');
            var c = st.counters;
            b.innerHTML =
              '<b>完成</b> ' +
              st.sil +
              (st.medium ? ' Medium' : '') +
              ' · ' +
              elapsed().toFixed(1) +
              ' 秒<br>' +
              'ドラッグ ' +
              c.drags +
              ' · タップ ' +
              c.taps +
              ' · 戻り ' +
              c.returnedToTray +
              ' · Undo ' +
              c.undos +
              ' · 誤操作 ' +
              (st.tallies.misRotation + st.tallies.misReplace + st.tallies.wrongSnap);
            b.hidden = false;
          }
          render();
        }

        function startAttempt(silId, medium, why) {
          if (st.counters && !st.done && st.t0 !== null) log(summaryLine('ABANDON'));
          st.sil = silId;
          st.medium = !!medium;
          st.P = {};
          IDS.forEach(function (id) {
            st.P[id] = { placed: false, x: 0, y: 0, rot: 0, flip: 0, fixed: false, pivot: null };
          });
          if (st.medium) {
            MEDIUM_FIXED.forEach(function (id) {
              var s = SIL[silId].solution[id];
              st.P[id] = {
                placed: true,
                x: s.x,
                y: s.y,
                rot: s.rot,
                flip: s.flip,
                fixed: true,
                pivot: null,
              };
            });
          }
          st.selected = null;
          st.undo = [];
          st.counters = newCounters();
          st.t0 = null;
          st.done = false;
          st.tallies = { misRotation: 0, misReplace: 0, wrongSnap: 0 };
          press = null;
          carry = null;
          clickEat = null;
          tapOk = null;
          document.getElementById('banner').hidden = true;
          layout();
          log(
            (why || 'START') +
              ' ' +
              silId +
              ' ' +
              (st.medium ? 'medium' : 'easy') +
              ' rule=' +
              RULE +
              ' ppu=' +
              L.ppu.toFixed(1) +
              ' smallLeg=' +
              Math.round(Math.SQRT2 * L.ppu) +
              'px board=' +
              L.W +
              'px',
          );
          buildBoardStatic();
          render();
        }

        // ===================================================================
        // DOM: board, tray, overlay
        // ===================================================================
        var SVGNS = 'http://www.w3.org/2000/svg';
        var boardEl = document.getElementById('board');
        var trayEl = document.getElementById('tray');
        var overlayEl = document.getElementById('overlay');
        var overlayPoly = overlayEl.querySelector('polygon');
        var silLayer = document.createElementNS(SVGNS, 'g');
        var pieceLayer = document.createElementNS(SVGNS, 'g');
        boardEl.appendChild(silLayer);
        boardEl.appendChild(pieceLayer);
        var boardG = {},
          trayB = {};
        var infoEl = document.getElementById('info');
        var infoL1 = document.createElement('div'),
          infoL2 = document.createElement('div');
        infoEl.appendChild(infoL1);
        infoEl.appendChild(infoL2);

        function layout() {
          var W = Math.min(window.innerWidth - 2 * K.GUTTER_PX, K.BOARD_MAX_PX);
          if (K.RESERVE_ADS) W = Math.min(W, window.innerHeight - K.ADS_PX - K.FIXED_ROWS_PX);
          W = Math.max(160, Math.floor(W));
          var sil = SIL[st.sil],
            bb = sil.bbox,
            bw = bb[2] - bb[0],
            bh = bb[3] - bb[1];
          var inner = W - 2 * K.BOARD_MARGIN_PX;
          var ppu = Math.min(inner / bw, inner / bh) * K.BOARD_SCALE;
          L.W = W;
          L.ppu = ppu;
          L.ox = (W - bw * ppu) / 2 - bb[0] * ppu;
          L.oy = (W - bh * ppu) / 2 - bb[1] * ppu;
          document.getElementById('app').style.width = W + 2 * K.GUTTER_PX + 'px';
          document.getElementById('logWrap').style.width = W + 2 * K.GUTTER_PX + 'px';
          boardEl.setAttribute('width', W);
          boardEl.setAttribute('height', W);
          boardEl.setAttribute('viewBox', '0 0 ' + W + ' ' + W);
          document.getElementById('ads').hidden = !K.RESERVE_ADS;
        }
        function toBoard(p) {
          return [L.ox + p[0] * L.ppu, L.oy + p[1] * L.ppu];
        }
        function ptsAttr(poly, fn) {
          return poly
            .map(function (p) {
              var q = fn(p);
              return q[0].toFixed(2) + ',' + q[1].toFixed(2);
            })
            .join(' ');
        }

        function buildBoardStatic() {
          while (silLayer.firstChild) silLayer.removeChild(silLayer.firstChild);
          var sil = SIL[st.sil];
          var sp = document.createElementNS(SVGNS, 'polygon');
          sp.setAttribute('class', 'sil');
          sp.setAttribute('points', ptsAttr(sil.poly, toBoard));
          silLayer.appendChild(sp);
          if (!st.medium) {
            IDS.forEach(function (id) {
              var g = document.createElementNS(SVGNS, 'polygon');
              g.setAttribute('class', 'guide');
              g.setAttribute('points', ptsAttr(sil.solPolys[id], toBoard));
              silLayer.appendChild(g);
            });
          }
          boardEl.setAttribute(
            'aria-label',
            '影絵 ' + st.sil + (st.medium ? '(Medium)' : '(Easy)'),
          );
        }

        function buildPieces() {
          IDS.forEach(function (id) {
            // Board piece: one <g> per piece, persistent (never re-created, so pointer capture survives).
            var g = document.createElementNS(SVGNS, 'g');
            g.setAttribute('class', 'bp');
            g.setAttribute('data-piece', id);
            g.setAttribute('tabindex', '0');
            g.setAttribute('role', 'button');
            var poly = document.createElementNS(SVGNS, 'polygon');
            poly.setAttribute('class', 'pc s' + SHADE[id]);
            g.appendChild(poly);
            pieceLayer.appendChild(g);
            boardG[id] = g;
            wirePointer(g, id, 'board');
            // Tray piece: a real <button>.
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'tp';
            b.setAttribute('data-piece', id);
            var svg = document.createElementNS(SVGNS, 'svg');
            svg.setAttribute('viewBox', '-40 -32 80 64');
            svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            var tp = document.createElementNS(SVGNS, 'polygon');
            tp.setAttribute('class', 'pc s' + SHADE[id]);
            svg.appendChild(tp);
            b.appendChild(svg);
            trayEl.appendChild(b);
            trayB[id] = b;
            wirePointer(b, id, 'tray');
          });
        }

        function label(id) {
          var p = st.P[id];
          return (
            KIND[id] +
            '・向き ' +
            p.rot +
            '×45°' +
            (canFlip(id) ? (p.flip ? '・裏' : '・表') : '') +
            (p.placed ? '・盤の上' : '・トレイ') +
            (p.fixed ? '・固定' : '')
          );
        }
        function render() {
          IDS.forEach(function (id) {
            var p = st.P[id],
              g = boardG[id],
              b = trayB[id];
            var lifted = carry && carry.id === id;
            if (p.placed) {
              g.style.display = '';
              g.firstChild.setAttribute('points', ptsAttr(xf(id, p), toBoard));
            } else if (!(lifted && carry.source === 'board')) {
              g.style.display = 'none';
            }
            g.setAttribute(
              'class',
              'bp' +
                (p.fixed ? ' fixed' : '') +
                (st.selected === id ? ' sel' : '') +
                (lifted && carry.source === 'board' ? ' lifted' : ''),
            );
            g.setAttribute('aria-label', label(id));
            if (p.fixed) g.setAttribute('aria-disabled', 'true');
            else g.removeAttribute('aria-disabled');
            b.style.visibility = p.placed && !(lifted && carry.source === 'tray') ? 'hidden' : '';
            b.className =
              'tp' +
              (st.selected === id ? ' sel' : '') +
              (lifted && carry.source === 'tray' ? ' lifted' : '');
            b.setAttribute('aria-label', label(id));
            // Tray drawing: same orientation, reduced scale, centred on its bounding box.
            var tw = xf(id, { x: 0, y: 0, rot: p.rot, flip: p.flip });
            var tx = tw.map(function (q) {
                return q[0];
              }),
              ty = tw.map(function (q) {
                return q[1];
              });
            var cx = (Math.min.apply(null, tx) + Math.max.apply(null, tx)) / 2;
            var cy = (Math.min.apply(null, ty) + Math.max.apply(null, ty)) / 2;
            b.firstChild.firstChild.setAttribute(
              'points',
              ptsAttr(tw, function (q) {
                return [(q[0] - cx) * K.TRAY_PPU, (q[1] - cy) * K.TRAY_PPU];
              }),
            );
          });
          var sel = st.selected ? st.P[st.selected] : null;
          document.getElementById('btnFlip').disabled = !(
            sel &&
            canFlip(st.selected) &&
            !sel.fixed
          );
          document.getElementById('btnRotate').disabled = !(sel && !sel.fixed);
          document.getElementById('btnUndo').disabled = !st.undo.length;
          document.getElementById('tallyRot').textContent =
            TXT.tally.misRotation[0] + ' ' + st.tallies.misRotation;
          document.getElementById('tallyRep').textContent =
            TXT.tally.misReplace[0] + ' ' + st.tallies.misReplace;
          document.getElementById('tallySnap').textContent =
            TXT.tally.wrongSnap[0] + ' ' + st.tallies.wrongSnap;
          Array.prototype.forEach.call(document.querySelectorAll('[data-sil]'), function (el) {
            el.className = el.getAttribute('data-sil') === st.sil ? 'on' : '';
          });
          document.getElementById('btnMedium').className = st.medium ? 'on' : '';
          infoL1.textContent =
            st.sil +
            ' ' +
            SIL[st.sil].name +
            (st.medium ? ' · Medium' : ' · Easy') +
            ' · ' +
            L.ppu.toFixed(1) +
            ' px/u · 小三角の脚 ' +
            Math.round(Math.SQRT2 * L.ppu) +
            'px';
          infoL2.textContent = 'rule=' + RULE + (K.GUIDE_SNAP ? ' (境界線にも吸着: 比較用)' : '');
          drawCarry();
        }
        function drawCarry() {
          if (!carry) {
            overlayPoly.style.display = 'none';
            overlayPoly.setAttribute('class', 'carry');
            return;
          }
          var r = boardEl.getBoundingClientRect();
          overlayEl.setAttribute('width', window.innerWidth);
          overlayEl.setAttribute('height', window.innerHeight);
          var pose = carry.snap ? carry.snap.pose : carry.raw;
          overlayPoly.setAttribute(
            'points',
            ptsAttr(xf(carry.id, pose), function (p) {
              var q = toBoard(p);
              return [r.left + q[0], r.top + q[1]];
            }),
          );
          overlayPoly.setAttribute(
            'class',
            'carry ' + (carry.snap ? 'ok' : 'ng') + ' s' + SHADE[carry.id],
          );
          overlayPoly.style.display = '';
        }

        // ===================================================================
        // Pointer input (one finger). Contract: every element that listens to
        // pointerup also listens to pointercancel; the pressed pointerId is
        // remembered; a click left behind by a drag is eaten.
        // ===================================================================
        function screenToUnit(cx, cy) {
          var r = boardEl.getBoundingClientRect();
          return [(cx - r.left - L.ox) / L.ppu, (cy - r.top - L.oy) / L.ppu];
        }
        function rawFromFinger(pr, cx, cy) {
          var p = st.P[pr.id];
          var u =
            pr.source === 'tray'
              ? screenToUnit(cx, cy - K.TRAY_LIFT_PX)
              : screenToUnit(cx + pr.gdx, cy + pr.gdy);
          return { x: u[0], y: u[1], rot: p.rot, flip: p.flip };
        }
        var rafPending = false,
          lastMove = null;
        function scheduleCarry(cx, cy) {
          lastMove = [cx, cy];
          if (rafPending) return;
          rafPending = true;
          requestAnimationFrame(function () {
            rafPending = false;
            if (!carry || !press || !lastMove) return;
            carry.raw = rawFromFinger(press, lastMove[0], lastMove[1]);
            carry.snap = findSnap(carry.id, carry.raw, K.SNAP_PX / L.ppu);
            carry.drawnAt = lastMove;
            drawCarry();
          });
        }

        function wirePointer(el, id, source) {
          el.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            if (press || carry) {
              if (press && e.pointerId !== press.pointerId) {
                st.counters.ignoredPointers++;
                clickEat = { el: el };
                log('second pointer ' + e.pointerId + ' on ' + id + ' ignored');
              }
              return;
            }
            clickEat = null;
            tapOk = null;
            if (st.P[id].fixed) {
              st.counters.fixedPresses++;
              log('press on fixed ' + id + ' (no-op)');
              return;
            }
            startClock();
            press = {
              id: id,
              pointerId: e.pointerId,
              el: el,
              source: st.P[id].placed ? 'board' : 'tray',
              sx: e.clientX,
              sy: e.clientY,
              dragging: false,
              gdx: 0,
              gdy: 0,
              t: performance.now(),
            };
            if (press.source === 'board') {
              var r = boardEl.getBoundingClientRect(),
                p = st.P[id];
              press.gdx = r.left + L.ox + p.x * L.ppu - e.clientX;
              press.gdy = r.top + L.oy + p.y * L.ppu - e.clientY;
            }
            try {
              el.setPointerCapture(e.pointerId);
            } catch (err) {
              /* ignore */
            }
            st.selected = id;
            render();
          });
          el.addEventListener('pointermove', function (e) {
            if (!press || press.el !== el || e.pointerId !== press.pointerId) return;
            e.preventDefault();
            if (!press.dragging) {
              var dx = e.clientX - press.sx,
                dy = e.clientY - press.sy;
              if (Math.sqrt(dx * dx + dy * dy) < K.TAP_SLOP_PX) return;
              press.dragging = true;
              st.counters.drags++;
              var p = st.P[id];
              carry = {
                id: id,
                source: press.source,
                raw: rawFromFinger(press, e.clientX, e.clientY),
                snap: null,
                kbd: false,
                drawnAt: [e.clientX, e.clientY],
              };
              carry.snap = findSnap(id, carry.raw, K.SNAP_PX / L.ppu);
              log('drag start ' + id + ' from ' + press.source + ' (rot=' + p.rot * 45 + ')');
              render();
            }
            scheduleCarry(e.clientX, e.clientY);
          });
          function end(e, cancelled) {
            if (!press || press.el !== el || e.pointerId !== press.pointerId) return;
            try {
              if (el.hasPointerCapture && el.hasPointerCapture(e.pointerId))
                el.releasePointerCapture(e.pointerId);
            } catch (err) {
              /* ignore */
            }
            var pr = press;
            press = null;
            lastMove = null;
            if (cancelled) {
              st.counters.cancels++;
              clickEat = { el: el };
              if (pr.dragging) {
                carry = null;
                if (pr.source === 'board') {
                  pushUndo('return');
                  toTray(id);
                }
                log('pointercancel during drag: ' + id + ' -> tray');
                afterChange();
              } else {
                log('pointercancel (press) ' + id);
                render();
              }
              return;
            }
            if (!pr.dragging) {
              // The click that follows rotates. If the browser never sends that click (seen in
              // headless Chromium for a tap within ~0.3 s of a drag), log it as a lost tap so the
              // device run shows whether it happens on real phones.
              var mark = (tapOk = { el: el, t: performance.now() });
              setTimeout(function () {
                if (tapOk === mark) {
                  tapOk = null;
                  st.counters.lostTaps++;
                  log('tap on ' + id + ' got no click (lost tap)');
                }
              }, 600);
              return;
            }
            clickEat = { el: el };
            // Release: decide from the pose drawn last (carry.snap: filled = place there, null = outline
            // = back to the tray), NOT from the pointerup point. Drawing is throttled to rAF, so a move +
            // lift within one frame would otherwise do something the screen never showed.
            var s = carry ? carry.snap : null;
            var at = carry && carry.drawnAt;
            if (at) {
              var off = Math.sqrt(
                (e.clientX - at[0]) * (e.clientX - at[0]) +
                  (e.clientY - at[1]) * (e.clientY - at[1]),
              );
              if (off > 0.5)
                log(
                  'release ' +
                    off.toFixed(1) +
                    'px from the last drawn point: decided from the drawn pose',
                );
            }
            carry = null;
            if (s) {
              var op = pr.source === 'board' ? 'replace' : 'place';
              pushUndo(op);
              setPlaced(id, s.pose, s.anchor);
              if (op === 'place') st.counters.places++;
              else st.counters.replaces++;
              log(
                op +
                  ' ' +
                  id +
                  ' ' +
                  fmtPose(s.pose) +
                  ' snap=' +
                  s.kind +
                  ' d=' +
                  (s.d * L.ppu).toFixed(1) +
                  'px',
              );
            } else {
              st.counters.returnedToTray++;
              if (pr.source === 'board') {
                pushUndo('return');
                toTray(id);
              }
              log('invalid release ' + id + ' -> tray (from ' + pr.source + ')');
            }
            afterChange();
          }
          el.addEventListener('pointerup', function (e) {
            end(e, false);
          });
          el.addEventListener('pointercancel', function (e) {
            end(e, true);
          });
          el.addEventListener('lostpointercapture', function (e) {
            // Capture lost while still pressed (should not happen: elements are never removed) -> treat as cancel.
            if (press && press.el === el && e.pointerId === press.pointerId) end(e, true);
          });
          el.addEventListener('click', function (e) {
            e.preventDefault();
            if (clickEat && clickEat.el === el) {
              clickEat = null;
              if (tapOk && tapOk.el === el) tapOk = null; // this click was delivered (and eaten): not a lost tap
              if (e.detail > 0) {
                st.counters.consumedClicks++;
                log('click after drag/cancel eaten (' + id + ')');
              }
              return;
            }
            if (e.detail === 0) return; // keyboard activation is handled on keydown
            if (press || carry) return; // a click while another finger is down does nothing
            if (!tapOk || tapOk.el !== el || performance.now() - tapOk.t > 1000) return;
            tapOk = null;
            st.counters.taps++;
            rotatePiece(id, 'tap');
          });
          el.addEventListener('contextmenu', function (e) {
            e.preventDefault();
          });
        }

        // ===================================================================
        // Keyboard
        // ===================================================================
        function focusedPiece() {
          var a = document.activeElement;
          return a && a.getAttribute ? a.getAttribute('data-piece') : null;
        }
        function kbdLift(id) {
          var p = st.P[id];
          if (p.fixed) return;
          startClock();
          st.selected = id;
          var sil = SIL[st.sil],
            bb = sil.bbox;
          var raw = p.placed
            ? { x: p.x, y: p.y, rot: p.rot, flip: p.flip }
            : { x: (bb[0] + bb[2]) / 2, y: (bb[1] + bb[3]) / 2, rot: p.rot, flip: p.flip };
          carry = { id: id, source: p.placed ? 'board' : 'tray', raw: raw, snap: null, kbd: true };
          kbdUpdate();
          log('kbd lift ' + id);
          render();
        }
        function kbdUpdate() {
          carry.snap = findSnap(carry.id, carry.raw, K.KBD_SNAP_STEPS * STEP);
        }
        function kbdPlace() {
          var id = carry.id,
            s = carry.snap;
          if (!s) {
            log('kbd place ' + id + ': no valid snap (stays lifted)');
            return;
          }
          var op = carry.source === 'board' ? 'replace' : 'place';
          carry = null;
          pushUndo(op);
          setPlaced(id, s.pose, s.anchor);
          st.counters.kbdPlaces++;
          log('kbd ' + op + ' ' + id + ' ' + fmtPose(s.pose) + ' snap=' + s.kind);
          afterChange();
          boardG[id].focus();
        }
        document.addEventListener('keydown', function (e) {
          var k = e.key;
          if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) {
            e.preventDefault();
            if (!press && !carry) doUndo('key');
            return;
          }
          if (press) return;
          if (carry && carry.kbd) {
            var c = carry;
            if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
              e.preventDefault();
              if (k === 'ArrowLeft') c.raw.x -= STEP;
              if (k === 'ArrowRight') c.raw.x += STEP;
              if (k === 'ArrowUp') c.raw.y -= STEP;
              if (k === 'ArrowDown') c.raw.y += STEP;
              kbdUpdate();
              drawCarry();
            } else if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
              e.preventDefault();
              kbdPlace();
            } else if (k === 'r' || k === 'R') {
              e.preventDefault();
              c.raw.rot = (c.raw.rot + 1) % 8;
              kbdUpdate();
              drawCarry();
            } else if ((k === 'f' || k === 'F') && canFlip(c.id)) {
              e.preventDefault();
              c.raw.flip = c.raw.flip ? 0 : 1;
              kbdUpdate();
              drawCarry();
            } else if (k === 'Escape') {
              e.preventDefault();
              var id = c.id;
              carry = null;
              if (st.P[id].placed) {
                returnPiece(id, 'key');
              } else {
                log('kbd cancel ' + id + ' -> tray');
                render();
              }
              trayB[id].focus();
            } else if (k === 'Tab') {
              e.preventDefault();
            }
            return;
          }
          var fid = focusedPiece();
          if (!fid || !st.P[fid]) return;
          if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
            e.preventDefault();
            kbdLift(fid);
          } else if (k === 'r' || k === 'R') {
            e.preventDefault();
            rotatePiece(fid, 'key');
          } else if (k === 'f' || k === 'F') {
            e.preventDefault();
            flipPiece(fid, 'key');
          } else if (k === 'Escape') {
            e.preventDefault();
            if (returnPiece(fid, 'key')) trayB[fid].focus();
          }
        });
        // Swallow keyup of Space/Enter on pieces so a <button> never self-activates.
        document.addEventListener('keyup', function (e) {
          if ((e.key === ' ' || e.key === 'Enter') && focusedPiece()) e.preventDefault();
        });

        // ===================================================================
        // Buttons
        // ===================================================================
        function busy(what) {
          if (press || carry) {
            log(what + ' ignored (a piece is held)');
            return true;
          }
          return false;
        }
        document.getElementById('btnRotate').addEventListener('click', function () {
          if (busy('rotate button') || !st.selected) return;
          if (rotatePiece(st.selected, 'button')) st.counters.rotateButton++;
        });
        document.getElementById('btnFlip').addEventListener('click', function () {
          if (busy('flip button') || !st.selected) return;
          flipPiece(st.selected, 'button');
        });
        document.getElementById('btnUndo').addEventListener('click', function () {
          if (busy('undo button')) return;
          doUndo('button');
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-tally]'), function (el) {
          el.addEventListener('click', function () {
            var k = el.getAttribute('data-tally');
            st.tallies[k]++;
            log('TALLY ' + k + ' = ' + st.tallies[k] + ' (' + TXT.tally[k][1] + ')');
            render();
          });
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-sil]'), function (el) {
          el.addEventListener('click', function () {
            if (busy('silhouette')) return;
            var id = el.getAttribute('data-sil');
            startAttempt(id, st.medium, id === st.sil ? 'RESTART' : 'START');
          });
        });
        document.getElementById('btnMedium').addEventListener('click', function () {
          if (busy('medium')) return;
          startAttempt(st.sil, !st.medium, 'START');
        });
        document.getElementById('btnCopy').addEventListener('click', function () {
          var btn = this,
            text = logLines.join('\n');
          function fallback() {
            logEl.focus();
            logEl.select();
            var ok = false;
            try {
              ok = document.execCommand('copy');
            } catch (err) {
              ok = false;
            }
            // Fallback (plain http on the LAN is not a secure context): the log is left selected.
            btn.textContent = ok ? TXT.copied : TXT.copyManual;
          }
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(function () {
              btn.textContent = TXT.copied;
            }, fallback);
          } else {
            fallback();
          }
          setTimeout(function () {
            btn.textContent = TXT.copy;
          }, 2500);
        });
        window.addEventListener('resize', function () {
          if (press || carry) return;
          layout();
          buildBoardStatic();
          render();
        });

        // ===================================================================
        // Boot
        // ===================================================================
        buildPieces();
        log(
          'PHASE0 tangram-board rule=' +
            RULE +
            ' | ' +
            deviceLine() +
            ' | knobs ' +
            JSON.stringify(K),
        );
        selfCheck().forEach(function (r) {
          log('selfcheck ' + r.id + ' ' + (r.ok ? 'ok' : 'FAIL ' + JSON.stringify(r)));
        });
        startAttempt('E1', false, 'START');

        // ===================================================================
        // TEST-ONLY debug API (check-tangram.mjs). Not used by the tester.
        // ===================================================================
        function poseOut(id) {
          var p = st.P[id];
          return { id: id, x: p.x, y: p.y, rot: p.rot, flip: p.flip, fixed: p.fixed };
        }
        window.__p0 = {
          state: function () {
            var trayPose = {};
            IDS.forEach(function (id) {
              if (!st.P[id].placed) trayPose[id] = { rot: st.P[id].rot, flip: st.P[id].flip };
            });
            var c = {};
            Object.keys(st.counters).forEach(function (k) {
              c[k] = st.counters[k];
            });
            Object.keys(st.tallies).forEach(function (k) {
              c[k] = st.tallies[k];
            });
            return {
              silhouette: st.sil,
              medium: st.medium,
              placed: IDS.filter(function (id) {
                return st.P[id].placed;
              }).map(poseOut),
              tray: IDS.filter(function (id) {
                return !st.P[id].placed;
              }),
              trayPose: trayPose,
              selected: st.selected,
              counters: c,
              complete: isComplete(),
              carrying: carry ? { id: carry.id, valid: !!carry.snap } : null,
              undoDepth: st.undo.length,
              done: st.done,
              bannerVisible: !document.getElementById('banner').hidden,
              rule: RULE,
            };
          },
          pieces: function () {
            var o = {};
            IDS.forEach(function (id) {
              o[id] = LOCAL[id].map(function (p) {
                return p.slice();
              });
            });
            return o;
          },
          solution: function (sid) {
            var s = SIL[sid || st.sil];
            return IDS.map(function (id) {
              var p = s.solution[id];
              return { id: id, x: p.x, y: p.y, rot: p.rot, flip: p.flip };
            });
          },
          place: function (id, x, y, rot, flip) {
            var p = st.P[id];
            if (!p || p.fixed || press || carry) return false;
            var pose = { x: x, y: y, rot: ((rot % 8) + 8) % 8, flip: canFlip(id) && flip ? 1 : 0 };
            if (!validPose(id, pose)) {
              log('api place ' + id + ' invalid');
              return false;
            }
            var op = p.placed ? 'replace' : 'place';
            startClock();
            pushUndo(op);
            setPlaced(id, pose);
            log('api ' + op + ' ' + id + ' ' + fmtPose(pose));
            afterChange();
            return true;
          },
          rotate: function (id) {
            return rotatePiece(id, 'api');
          },
          pivot: function (id) {
            return st.P[id] && st.P[id].placed ? pivotOf(id) : null;
          },
          flip: function (id) {
            return flipPiece(id, 'api');
          },
          returnToTray: function (id) {
            return returnPiece(id, 'api');
          },
          undo: function () {
            return doUndo('api');
          },
          isComplete: isComplete,
          boardRect: function () {
            var r = boardEl.getBoundingClientRect();
            return {
              left: r.left,
              top: r.top,
              width: r.width,
              height: r.height,
              ppu: L.ppu,
              ox: r.left + L.ox,
              oy: r.top + L.oy,
              lift: K.TRAY_LIFT_PX,
              snapPx: K.SNAP_PX,
              step: STEP,
              trayPpu: K.TRAY_PPU,
            };
          },
          selfCheck: selfCheck,
          log: function () {
            return logLines.join('\n');
          },
        };
      })();
    </script>
  </body>
</html>
