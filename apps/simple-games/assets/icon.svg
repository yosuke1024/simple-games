<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Simple Games — the collection mark.
       Four tiles on the series ink: a set of games rather than any one of
       them. Deliberately unlettered, so adding a title never dates the icon,
       and legible down to launcher size where a symbol would turn to mush.
       The one recessed tile keeps the square from reading as a dead grid. -->
  <rect width="1024" height="1024" rx="224" fill="#232a33"/>
  <rect x="216" y="216" width="264" height="264" rx="64" fill="#fffdf8"/>
  <rect x="544" y="216" width="264" height="264" rx="64" fill="#fffdf8"/>
  <rect x="216" y="544" width="264" height="264" rx="64" fill="#fffdf8"/>
  <rect x="544" y="544" width="264" height="264" rx="64" fill="#8b95a3"/>
</svg>
