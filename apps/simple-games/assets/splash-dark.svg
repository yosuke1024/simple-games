  <rect x="1176" y="1380" width="176" height="176" rx="42" fill="#212730" stroke="#333b47" stroke-width="6"/>
  <rect x="1380" y="1380" width="176" height="176" rx="42" fill="#1a1f26" stroke="#333b47" stroke-width="6"/>
</svg>
