  <rect x="1176" y="1176" width="176" height="176" rx="42" fill="#fffdf8" stroke="#ddd7ca" stroke-width="6"/>
  <rect x="1380" y="1176" width="176" height="176" rx="42" fill="#fffdf8" stroke="#ddd7ca" stroke-width="6"/>
  <rect x="1176" y="1380" width="176" height="176" rx="42" fill="#fffdf8" stroke="#ddd7ca" stroke-width="6"/>
  <rect x="1380" y="1380" width="176" height="176" rx="42" fill="#e8e4d9" stroke="#ddd7ca" stroke-width="6"/>
</svg>
