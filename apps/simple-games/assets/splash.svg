<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <!-- The collection mark on paper. The splash is up for 400ms; it exists to
       avoid a white flash, not to be looked at, so it carries the mark and
       nothing else. -->
